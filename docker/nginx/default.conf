# Upstream Laravel PHP-FPM Service
upstream laravel_backend {
    server backend:9000;
}

# ==========================================================
# 1. FRONTEND SERVER (PORT 80)
# ==========================================================
server {
    listen 80;
    server_name _;

    root /var/www/frontend;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/json application/javascript application/xml image/svg+xml;

    # Laravel Storage files
    location ^~ /storage/ {
        alias /var/www/laravel/storage/app/public/;
        try_files $uri =404;
        access_log off;
        expires 30d;
    }

    # Laravel API endpoints
    location ^~ /api/ {
        root /var/www/laravel/public;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass laravel_backend;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/laravel/public/index.php;
        include fastcgi_params;
        fastcgi_read_timeout 300;
    }

    # Laravel Map Blade Route (for iframe)
    location = /map {
        root /var/www/laravel/public;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass laravel_backend;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/laravel/public/index.php;
        include fastcgi_params;
        fastcgi_read_timeout 300;
    }

    # Static assets with caching
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff|woff2)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # React SPA Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ==========================================================
# 2. LARAVEL DIRECT ACCESS (PORT 8000)
# ==========================================================
server {
    listen 8000;
    server_name _;

    root /var/www/laravel/public;
    index index.php index.html;

    # Allow iframe embedding & Cross-Origin
    add_header X-Frame-Options "ALLOWALL" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS, PUT, DELETE" always;
    add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept, Authorization, x-api-key" always;

    # Preflight OPTIONS check
    if ($request_method = 'OPTIONS') {
        return 204;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass laravel_backend;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/laravel/public$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
    }

    location ~ /\.ht {
        deny all;
    }
}
