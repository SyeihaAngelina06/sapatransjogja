services:
  backend:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: sapa_backend
    restart: unless-stopped
    volumes:
      - laravel_storage:/var/www/laravel/storage
    env_file:
      - path: .env
        required: false
      - path: ./sapa-laravel/.env
        required: false
    environment:
      - APP_NAME=sapatransjogja
      - APP_ENV=${APP_ENV:-production}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_KEY=${APP_KEY:-}
      - APP_URL=${APP_URL:-http://localhost}
      - DB_CONNECTION=${DB_CONNECTION:-pgsql}
      - DB_HOST=${DB_HOST:-aws-0-ap-south-1.pooler.supabase.com}
      - DB_PORT=${DB_PORT:-5432}
      - DB_DATABASE=${DB_DATABASE:-postgres}
      - DB_USERNAME=${DB_USERNAME:-postgres.vvtphdknouhhasjyrzrb}
      - DB_PASSWORD=${DB_PASSWORD:-lolosmapid123}
      - MAPID_API_KEY=${MAPID_API_KEY:-6a96793053df37905b3a5f4f}
      - MAPID_DATA_KEY=${MAPID_DATA_KEY:-6a967dda53df37905b3a5f58}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    networks:
      - sapa_network

  web:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    container_name: sapa_web
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-10}:80"
      - "${BACKEND_PORT:-8010}:8000"
    volumes:
      - laravel_storage:/var/www/laravel/storage:ro
    depends_on:
      - backend
    networks:
      - sapa_network

volumes:
  laravel_storage:

networks:
  sapa_network:
    driver: bridge
